.am{text-align:center;padding:12px}.am small{display:block;font-weight:700}.am b{font-size:40px}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 10px}.kp button{height:52px;border-radius:14px;background:var(--sf);font-size:24px;border:1px solid var(--bd)}.kp .ok{grid-area:3/5/5/6;height:auto;color:#fff;font-size:32px;border:0}
.dl{text-align:center;color:var(--mu);font-weight:700;padding:10px 0 2px;font-size:14px}
.bn{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:456px;margin:0 auto;background:var(--pr);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35)}
</style></head><body><div id="app"></div><input type="file" id="if" hidden><div class="ov" id="ov" data-a="x" hidden></div>
<script>
const CUR=[['IDR','Rp','id-ID','Rupiah'],['USD','$','en-US','Dolar AS'],['EUR','€','de-DE','Euro'],['TRY','₺','tr-TR','Lira Turki'],['GBP','£','en-GB','Pound Inggris'],['JPY','¥','ja-JP','Yen Jepang'],['CNY','CN¥','zh-CN','Yuan China'],['KRW','₩','ko-KR','Won Korea'],['MYR','RM','ms-MY','Ringgit'],['SGD','S$','en-SG','Dolar Singapura'],['AUD','A$','en-AU','Dolar Australia'],['CAD','C$','en-CA','Dolar Kanada'],['CHF','CHF','de-CH','Franc Swiss'],['SAR','SR','ar-SA','Riyal Saudi'],['AED','AED','ar-AE','Dirham UEA'],['INR','₹','en-IN','Rupee India'],['THB','฿','th-TH','Baht Thailand'],['VND','₫','vi-VN','Dong Vietnam'],['PHP','₱','en-PH','Peso Filipina'],['RUB','₽','ru-RU','Rubel Rusia'],['BRL','R$','pt-BR','Real Brasil'],['MXN','MX$','es-MX','Peso Meksiko'],['ZAR','R','en-ZA','Rand Afrika Selatan'],['NZD','NZ$','en-NZ','Dolar Selandia Baru'],['HKD','HK$','zh-HK','Dolar Hong Kong'],['PKR','₨','ur-PK','Rupee Pakistan'],['EGP','E£','ar-EG','Pound Mesir'],['NGN','₦','en-NG','Naira Nigeria'],['PLN','zł','pl-PL','Zloty Polandia'],['SEK','kr','sv-SE','Krona Swedia']];
const IC='🧺 🍴 🎟️ 🚌 🩺 🎁 🙂 👜 💵 🏠 ☕ 🍔 🛒 🚗 ⛽ 📱 💡 🎮 🎬 📚 🎓 ✈️ 👕 💊 🐶 🧾 💼 🏦 💳 👛 📈 🛠️ 💇 🏋️ 🎵 🧸 🍎 🚆 🔌 💰 🎉 🧹 🌐'.split(' ');
const CL='#42a5f5 #3f51b5 #ec407a #ffa726 #4caf50 #ef5350 #7e57c2 #795548 #009688 #5c6bc0 #26c6da #8d6e63 #ff7043 #9ccc65 #78909c'.split(' ');

const def=()=>({cur:'TRY',fmt:'sym',r:{m:'m',o:0,s:'',e:''},acc:[{id:'a1',n:'Kartu',i:'💳',c:'#5c6bc0',b:0,l:0}],

let S;try{S=JSON.parse(localStorage.getItem('catuang'))||def()}catch(e){S=def()}

let page='cat',mode='exp',edit=false,G,E,F={q:'',t:[],a:[],c:[]},ask_;
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ds(new Date());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)},fd=(s,o)=>pd(s).toLocaleDateString('id-ID',o||{day:'numeric',month:'short',year:'numeric'});
const cu=()=>CUR.find(c=>c[0]==S.cur)||CUR[0],lab=()=>S.fmt=='code'?cu()[0]:cu()[1];
const fmt=n=>(n<0?'-':'')+lab()+' '+new Intl.NumberFormat(cu()[2],{maximumFractionDigits:2}).format(Math.abs(n));
function rng(){const r=S.r,d=new Date();if(r.m=='all')return['0000','9999'];if(r.m=='c')return[sm(r.s,r.o),sm(r.e,r.o)];
if(r.m=='m'){const a=new Date(d.getFullYear(),d.getMonth()+r.o,1);return[ds(a),ds(new Date(a.getFullYear(),a.getMonth()+1,0))]}
const a=new Date(d);a.setDate(d.getDate()-((d.getDay()+6)%7)+7*r.o);const b=new Date(a);b.setDate(a.getDate()+6);return[ds(a),ds(b)]}
const inR=t=>{const[s,e]=rng();return t.d>=s&&t.d<=e};
function sm(s,n){if(!n)return s;const d=pd(s),t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(d.getDate(),new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return ds(t)}
function rlabel(){if(S.r.m=='all')return'Semua waktu';const[s,e]=rng();if(S.r.m=='m')return fd(s,{month:'long',year:'numeric'});return fd(s,{day:'numeric',month:'short'})+' – '+fd(e)}
const totals=t=>{const o={};S.tx.filter(x=>x.t==t&&inR(x)).forEach(x=>o[x.c]=(o[x.c]||0)+x.v);return o};
const acc=id=>S.acc.find(a=>a.id==id),cat=id=>[...S.cat.exp,...S.cat.inc].find(c=>c.id==id);
const SV={p:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9.5" r="3.5"/><path d="M5.5 19c1.5-3 4-4 6.500-4s5 1 6.500 4"/></svg>',
e:'<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M16 16l5 5"/></svg>'};
function sheet(h,keep){const o=$('#ov'),st=keep&&o.firstChild?o.firstChild.scrollTop:0;o.hidden=!h;o.innerHTML=h?'<div class="sh">'+h+'</div>':'';if(st)o.firstChild.scrollTop=st}
function render(){th();const sum=S.acc.reduce((a,b)=>a+b.b,0);
const rt=page=='cat'?`<button class="ib ${edit?'on':''}" data-a=edit>${SV.e}</button>`:page=='tx'?`<button class=ib data-a=srch>${SV.s}</button>`:'<span></span>';
let h=`<div class=top><button class=ib data-a=prof>${SV.p}</button><div class=bal><small>Semua akun</small><b>${fmt(sum)}</b></div>${rt}</div>`;
if(page!='acc')h+=`<div class=rr><button class=ib data-a=rs data-v=-1>«</button><button class=pill data-a=rng>${rlabel()} ▾</button><button class=ib data-a=rs data-v=1>»</button></div>`;
h+='<div class=main>'+(page=='cat'?pCat():page=='acc'?pAcc():pTx())+'</div>';
h+=`<div class=nav>${[['acc','💳','Akun'],['cat','🗂️','Kategori'],['tx','🧾','Transaksi']].map(([k,i,n])=>`<button class="${page==k?'on':''}" data-a=pg data-v=${k}><span>${i}</span>${n}</button>`).join('')}</div>`;
$('#app').innerHTML=h}
function pCat(){const L=S.cat[mode],tot=totals(mode),sum=Object.values(tot).reduce((a,b)=>a+b,0),C=2*Math.PI*40;let off=0,arcs='';
L.forEach(c=>{const v=tot[c.id]||0;if(v>0){const l=v/sum*C;arcs+=`<circle cx=50 cy=50 r=40 fill=none stroke="${c.c}" stroke-width=14 stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l}});
if(!sum)arcs=`<circle cx=50 cy=50 r=40 fill=none stroke="var(--sf)" stroke-width=14 />`;
let h=`<div class="grid ${edit?'ed':''}"><button class=dn data-a=tg><svg viewBox="0 0 100 100">${arcs}</svg><div>${mode=='exp'?'Pengeluaran':'Pemasukan'}<b>${fmt(sum)}</b></div></button>`;

if(edit&&L.length<12)h+=`<button class=c data-a=newcat><span class=cn>Tambah</span><span class=ci style="background:var(--sf);color:var(--pr)">+</span><span class=ca>${L.length}/12</span></button>`;

function lastAcc(c){const l=S.last&&S.last[c];if(l&&acc(l))return l;let b=null;S.tx.forEach(t=>{if(t.c==c&&acc(t.a)&&(!b||parseInt(t.id)>parseInt(b.id)))b=t});return b?b.a:S.acc[0].id}
function pAcc(){return S.acc.map(a=>`<button class=li data-a=acm data-v=${a.id}><span class=ci style="background:${a.c}">${a.i}</span><span class=t><b>${esc(a.n)}</b>${a.l>0?`<small class="${a.l-Math.max(-a.b,0)<=0?'ex':''}">Sisa limit ${fmt(Math.max(a.l-Math.max(-a.b,0),0))} dari ${fmt(a.l)}</small>`:''}</span><b class="${a.b<0?'ex':''}">${fmt(a.b)}</b></button>`).join('')+'<button class=add data-a=newacc>+ Tambah akun</button>'}
function flt(){return S.tx.filter(t=>inR(t)&&(!F.t.length||F.t.includes(t.t))&&(!F.a.length||F.a.includes(t.a)||F.a.includes(t.b))&&(!F.c.length||F.c.includes(t.c))&&(!F.q||(t.n||'').toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id))}
function pTx(){const L=flt();if(!L.length)return'<p class=emp>Belum ada transaksi di rentang ini.<br>Ketuk kategori di halaman Kategori untuk mencatat.</p>';let d='',h='';
L.forEach(t=>{if(t.d!=d){d=t.d;h+=`<div class=dh>${fd(d,{weekday:'long',day:'numeric',month:'short',year:'numeric'})}</div>`}
const c=cat(t.c),tr=t.t=='tr',ic=tr?'⇄':c?c.i:'❔',bg=tr?'#78909c':c?c.c:'#999',nm=tr?'Transfer':c?c.n:'Kategori dihapus',ac=tr?(acc(t.a)||{}).n+' → '+(acc(t.b)||{}).n:(acc(t.a)||{}).n;
h+=`<button class=li data-a=dtx data-v=${t.id}><span class=ci style="background:${bg}">${ic}</span><span class=t><b>${esc(nm)}</b><small>${esc(ac||'')}${t.n?' – '+esc(t.n):''}</small></span><b class="${t.t=='tr'?'':(t.t=='inc')==(t.v>=0)?'inn':'ex'}">${t.t=='tr'?'':(t.t=='inc')==(t.v>=0)?'+':'-'}${fmt(Math.abs(t.v))}</b></button>`});return h}
const A={x:(v,t,e)=>{if(e.target===t)sheet('')},pg:v=>{page=v;edit=false;render()},edit:()=>{edit=!edit;render()},tg:()=>{mode=mode=='exp'?'inc':'exp';render()},
rs:v=>{if(S.r.m=='m'||S.r.m=='w'||S.r.m=='c'){S.r.o+=+v;save();render()}},
rng:()=>{const[s,e]=rng();sheet(`<h3>Rentang waktu</h3>${[['m','Per bulan'],['w','Per minggu'],['all','Semua waktu']].map(([m,n])=>`<button class="opt ${S.r.m==m?'on':''}" data-a=rm data-v=${m}>${n}</button>`).join('')}<div class=lb>Kustom</div><div class=row><label>Dari<input type=date id=cs value="${s>'0001'?s:today()}"></label><label>Sampai<input type=date id=ce value="${e<'9999'?e:today()}"></label></div><button class=btn data-a=ca>Terapkan rentang kustom</button>`)},

ca:()=>{const s=$('#cs').value,e=$('#ce').value;if(!s||!e||s>e)return;S.r={m:'c',o:0,s,e};save();sheet('');render()},

ff:v=>{S.fmt=v;save();A.prof();render()},tm:v=>{S.theme=v;save();render();A.prof()},rst:()=>sheet('<h3>Hapus data</h3><button class=opt data-a=rtx>🧾 Hapus semua transaksi saja<br><small style="font-weight:500">Akun, saldo, dan kategori tetap ada</small></button><button class=opt data-a=rall style="color:#d33">⚠️ Hapus semua data<br><small style="font-weight:500">Transaksi, akun, dan kategori kembali ke awal</small></button><button class="btn dng" data-a=no>Batal</button>'),rtx:()=>ask('Hapus semua '+S.tx.length+' transaksi? Akun dan kategori tetap.',()=>{S.tx=[];save()}),rall:()=>ask('Hapus semua data? Akun dan kategori juga kembali ke awal.',()=>{const c=S.cur,f=S.fmt;S=def();S.cur=c;S.fmt=f;save()}),
